name: Build Mobile Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
    paths:
      - 'src/mobile/**'
      - '.github/workflows/build-mobile-apk.yml'

jobs:
  build-apk:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar dependencias npm
        working-directory: src/mobile
        run: |
          npm install

      - name: Compilar frontend web (Vite)
        working-directory: src/mobile
        run: |
          npm run build

      - name: Inicializar y sincronizar Capacitor Android
        working-directory: src/mobile
        run: |
          npx cap add android || npx cap sync android

      - name: Compilar APK Debug con Gradle
        working-directory: src/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Publicar archivo APK como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: gestor-finanzas-debug-apk
          path: src/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
