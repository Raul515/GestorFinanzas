name: Build Mobile Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
    paths:
      - 'src/mobile/**'
      - '.github/workflows/build-mobile-apk.yml'

jobs:
  build-apk:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar dependencias npm
        working-directory: src/mobile
        run: |
          npm install

      - name: Verificar tipos TypeScript y compilar frontend web (Vite)
        working-directory: src/mobile
        run: |
          npx tsc --noEmit
          npm run build

      - name: Inicializar y sincronizar Capacitor Android
        working-directory: src/mobile
        run: |
          npx cap add android || npx cap sync android

      - name: Configurar permisos AndroidManifest y versión APK (HTTP LAN, Cámara y Edge-to-Edge)
        working-directory: src/mobile
        run: |
          python3 - << 'EOF'
          from pathlib import Path
          import re

          manifest_path = Path("android/app/src/main/AndroidManifest.xml")
          manifest = manifest_path.read_text(encoding="utf-8")

          if 'android:usesCleartextTraffic="true"' not in manifest:
              manifest = manifest.replace("<application", '<application android:usesCleartextTraffic="true"', 1)

          if "android.permission.CAMERA" not in manifest:
              manifest = manifest.replace(
                  "</manifest>",
                  '    <uses-permission android:name="android.permission.CAMERA" />\n</manifest>',
                  1,
              )

          if "android.media.action.IMAGE_CAPTURE" not in manifest:
              queries_block = (
                  "    <queries>\n"
                  "        <intent>\n"
                  '            <action android:name="android.media.action.IMAGE_CAPTURE" />\n'
                  "        </intent>\n"
                  "    </queries>\n"
              )
              manifest = manifest.replace("</manifest>", f"{queries_block}</manifest>", 1)

          manifest_path.write_text(manifest, encoding="utf-8")

          gradle_path = Path("android/app/build.gradle")
          gradle = gradle_path.read_text(encoding="utf-8")
          gradle = re.sub(r"versionCode\s+\d+", "versionCode 14", gradle, count=1)
          gradle = re.sub(r'versionName\s+"[^"]+"', 'versionName "1.4.0"', gradle, count=1)
          gradle_path.write_text(gradle, encoding="utf-8")
          EOF

      - name: Compilar APK Debug con Gradle
        working-directory: src/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Publicar archivo APK como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: gestor-finanzas-debug-apk
          path: src/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
