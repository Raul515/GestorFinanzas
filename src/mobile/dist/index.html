<!DOCTYPE html>
<html lang="es" class="h-full bg-slate-950 text-slate-100">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Gestor Finanzas • Móvil</title>
  <meta name="theme-color" content="#020617" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Finanzas" />
  <link rel="manifest" href="/mobile/manifest.json" />
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #020617;
      color: #f8fafc;
      height: 100%;
      overflow: hidden;
      user-select: none;
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }

    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    @keyframes popIn {
      from {
        opacity: 0;
        transform: translate(-50%, -10px);
      }

      to {
        opacity: 1;
        transform: translate(-50%, 0);
      }
    }

    .toast-anim {
      animation: popIn 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .btn-press:active {
      transform: scale(0.96);
    }

    .progress-bar-fill {
      transition: width 0.3s ease;
    }
  </style>
</head>

<body class="h-full flex flex-col justify-between">
  <div id="app" class="h-full flex flex-col justify-between max-w-sm mx-auto w-full"></div>

  <script>
    // ==========================================
    // SANITIZACIÓN XSS Y UTILIDADES DE SEGURIDAD (SEC-03)
    // ==========================================
    function escapeHtml(str) {
      if (str === null || str === undefined) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function selectFrequentConcept(idx) {
      state.concept = state.frequentConcepts[idx] || "";
      render();
    }

    function selectSearchTag(tag) {
      state.searchQueryHist = tag || "";
      render();
    }

    function openReceiptViewer(url) {
      state.viewingReceiptUrl = getReceiptUrl(url);
      render();
    }

    // ==========================================
    // ESTADO Y ALMACENAMIENTO OFFLINE
    // ==========================================
    const STORAGE_KEYS = {
      TRANSACTIONS: "gestor_mobile_transactions",
      CATALOG: "gestor_mobile_catalog",
      PAIRING_TOKEN: "gestor_mobile_pairing_token",
      HISTORY_CACHE: "gestor_mobile_history_cache",
      QUICK_PRESETS: "gestor_mobile_quick_presets"
    };

    const DEFAULT_QUICK_PRESETS = [
      { id: "preset-cafe", name: "Café", emoji: "☕", amount: 1.50, subcategory_name: "Café y Desayunos", concept: "Café" },
      { id: "preset-cena", name: "Cena", emoji: "🍽️", amount: 20.00, subcategory_name: "Restaurante", concept: "Cena" },
      { id: "preset-cine", name: "Cine", emoji: "🎬", amount: 5.50, subcategory_name: "Ocio y Cultura", concept: "Cine" }
    ];

    const DEFAULT_SUBCATEGORIES = [
      { id: 1, name: "Café y Desayunos", category_name: "Deseos (30%)", is_frequent: true, emoji: "☕" },
      { id: 2, name: "Supermercado", category_name: "Necesidades Básicas (50%)", is_frequent: true, emoji: "🛒" },
      { id: 3, name: "Restaurante", category_name: "Deseos (30%)", is_frequent: true, emoji: "🍽️" },
      { id: 4, name: "Gasolina", category_name: "Necesidades Básicas (50%)", is_frequent: true, emoji: "⛽" },
      { id: 5, name: "Farmacia", category_name: "Necesidades Básicas (50%)", is_frequent: true, emoji: "💊" },
      { id: 6, name: "Pádel / Ocio", category_name: "Deseos (30%)", is_frequent: true, emoji: "🎾" },
      { id: 7, name: "Alquiler / Hipoteca", category_name: "Necesidades Básicas (50%)", is_frequent: false, emoji: "🏠" },
      { id: 8, name: "Suministros (Luz, Agua)", category_name: "Necesidades Básicas (50%)", is_frequent: false, emoji: "💡" },
      { id: 9, name: "Suscripciones", category_name: "Deseos (30%)", is_frequent: false, emoji: "📱" },
      { id: 10, name: "Fondo de Emergencia", category_name: "Ahorro e Inversión (20%)", is_frequent: false, emoji: "🛡️" }
    ];

    const DEFAULT_CONCEPTS = ["Café con tostada", "Desayuno", "Mercadona", "Menú del día", "Gasolina", "Farmacia"];

    let state = {
      activeTab: "capture", // "capture" | "history" | "summary"
      amountStr: "0",
      selectedSubcat: DEFAULT_SUBCATEGORIES[0],
      concept: "",
      selectedDate: new Date().toISOString().split("T")[0],
      subcategories: DEFAULT_SUBCATEGORIES,
      frequentConcepts: DEFAULT_CONCEPTS,
      transactions: [],
      pairingToken: "",
      isOnline: false,
      isPaired: true,
      isSyncing: false,
      modalOpen: false,
      showTokenModal: false,
      isCreatingSubcat: false,
      newSubcatName: "",
      newSubcatCategory: "Deseos (30%)",
      searchQuery: "",
      showToast: false,
      // Estado de "Mi Mes"
      summaryMonth: new Date().toISOString().slice(0, 7),
      monthlySummary: null,
      loadingSummary: false,
      editingBudgetSubcatId: null,
      editBudgetAmount: "",
      // Estado OTA Updates
      currentVersionCode: 1,
      availableUpdate: null,
      // Estado Buscador Instantáneo e Histórico Offline (Fase 11)
      historyCache: [],
      searchQueryHist: "",
      searchServerResults: null,
      isSearchingServer: false,
      // Estado Foto Ticket (Fase 12)
      receiptBase64: null,
      viewingReceiptUrl: null,
      // Conmutador Gasto / Ingreso (Fase 13)
      txType: "EXPENSE",
      // Atajos Rápidos 1-Tap (Fase 14)
      presets: DEFAULT_QUICK_PRESETS,
      managePresetsModalOpen: false,
      toastMessage: "",
      toastUndoEventId: null
    };

    function triggerHaptic(ms = 15) {
      if (navigator.vibrate) navigator.vibrate(ms);
    }

    function loadLocalState() {
      try {
        // Extraer token de URL si viene en la query string (?token=sec_...)
        const params = new URLSearchParams(window.location.search);
        const urlToken = params.get("token");
        if (urlToken && urlToken.trim()) {
          state.pairingToken = urlToken.trim();
          localStorage.setItem(STORAGE_KEYS.PAIRING_TOKEN, state.pairingToken);
          // Limpiar query string sin recargar
          params.delete("token");
          const newQuery = params.toString();
          const newUrl = window.location.pathname + (newQuery ? "?" + newQuery : "") + window.location.hash;
          window.history.replaceState({}, document.title, newUrl);
        } else {
          state.pairingToken = localStorage.getItem(STORAGE_KEYS.PAIRING_TOKEN) || "";
        }

        const rawTx = localStorage.getItem(STORAGE_KEYS.TRANSACTIONS);
        if (rawTx) state.transactions = JSON.parse(rawTx);

        const rawHist = localStorage.getItem(STORAGE_KEYS.HISTORY_CACHE);
        if (rawHist) state.historyCache = JSON.parse(rawHist);

        const rawPresets = localStorage.getItem(STORAGE_KEYS.QUICK_PRESETS);
        if (rawPresets) {
          const parsedP = JSON.parse(rawPresets);
          if (Array.isArray(parsedP) && parsedP.length > 0) {
            state.presets = parsedP;
          }
        }

        const rawCat = localStorage.getItem(STORAGE_KEYS.CATALOG);
        if (rawCat) {
          const parsed = JSON.parse(rawCat);
          if (parsed.personal_subcategories && parsed.personal_subcategories.length > 0) {
            state.subcategories = parsed.personal_subcategories.map(s => ({
              ...s,
              emoji: getEmojiForName(s.name)
            }));
            state.selectedSubcat = state.subcategories.find(s => s.is_frequent) || state.subcategories[0];
          }
          if (parsed.frequent_concepts && parsed.frequent_concepts.length > 0) {
            state.frequentConcepts = parsed.frequent_concepts;
          }
        }
      } catch (e) {
        console.error("Error cargando estado local:", e);
      }
    }

    function saveTransactions() {
      try {
        localStorage.setItem(STORAGE_KEYS.TRANSACTIONS, JSON.stringify(state.transactions));
      } catch (e) {
        console.error(e);
      }
    }

    function saveCatalogLocally(catData) {
      try {
        localStorage.setItem(STORAGE_KEYS.CATALOG, JSON.stringify(catData));
      } catch (e) {
        console.error(e);
      }
    }

    function savePresetsLocally() {
      try {
        localStorage.setItem(STORAGE_KEYS.QUICK_PRESETS, JSON.stringify(state.presets));
      } catch (e) {
        console.error("Error guardando atajos:", e);
      }
    }

    let presetPressTimer = null;
    let didTriggerPresetLongPress = false;

    function handlePresetMouseDown(presetId) {
      didTriggerPresetLongPress = false;
      presetPressTimer = setTimeout(() => {
        didTriggerPresetLongPress = true;
        handleDirectSavePreset(presetId);
      }, 500);
    }

    function handlePresetMouseUp(presetId) {
      if (presetPressTimer) {
        clearTimeout(presetPressTimer);
        presetPressTimer = null;
      }
      if (!didTriggerPresetLongPress) {
        handleSelectPreset(presetId);
      }
      didTriggerPresetLongPress = false;
    }

    function handlePresetMouseCancel() {
      if (presetPressTimer) {
        clearTimeout(presetPressTimer);
        presetPressTimer = null;
      }
      didTriggerPresetLongPress = false;
    }

    function handleSelectPreset(presetId) {
      triggerHaptic(15);
      const p = state.presets.find(x => x.id === presetId);
      if (!p) return;
      state.txType = "EXPENSE";
      state.amountStr = String(p.amount).replace(".", ",");
      const matched = state.subcategories.find(s =>
        (p.subcategory_id && s.id === p.subcategory_id) ||
        (s.name.toLowerCase() === p.subcategory_name.toLowerCase())
      );
      if (matched) {
        state.selectedSubcat = matched;
      }
      state.concept = p.concept || p.name;
      render();
    }

    function handleDirectSavePreset(presetId) {
      const p = state.presets.find(x => x.id === presetId);
      if (!p) return;

      const targetSub = state.subcategories.find(s =>
        (p.subcategory_id && s.id === p.subcategory_id) ||
        (s.name.toLowerCase() === p.subcategory_name.toLowerCase())
      ) || state.selectedSubcat || state.subcategories[0];

      // Salvaguarda del Techo de Presupuesto de Deseos (Fase 10)
      const isWants = targetSub && ((targetSub.category_name && targetSub.category_name.toLowerCase().includes("deseo")) || targetSub.category_id === 3);
      const wants = state.monthlySummary && state.monthlySummary.wants;
      if (isWants && wants && wants.budget > 0) {
        const projected = wants.spent + p.amount;
        if (projected >= wants.budget) {
          triggerHaptic(50);
          handleSelectPreset(presetId);
          return;
        }
      }

      triggerHaptic(40);
      const newTx = {
        event_id: `mob-${Date.now()}-${Math.random().toString(36).substring(2, 9)}`,
        scope: "PERSONAL",
        type: "EXPENSE",
        amount: Math.round(p.amount * 100) / 100,
        description: p.concept || p.name,
        date: state.selectedDate,
        subcategory_id: targetSub.id,
        subcategory_name: targetSub.name,
        created_at_utc: new Date().toISOString(),
        status: "PENDING_SYNC"
      };

      state.transactions.unshift(newTx);
      saveTransactions();

      if (isWants && wants) {
        wants.spent += newTx.amount;
        wants.remaining = wants.budget - wants.spent;
      }

      state.toastMessage = `${p.emoji} ${p.name} (${p.amount.toFixed(2).replace(".", ",")} €) guardado`;
      state.toastUndoEventId = newTx.event_id;
      state.showToast = true;
      render();

      setTimeout(() => {
        if (state.toastUndoEventId === newTx.event_id) {
          state.showToast = false;
          state.toastUndoEventId = null;
          state.toastMessage = "";
          render();
        }
      }, 4000);

      if (state.isOnline && state.isPaired) {
        setTimeout(syncPendingTransactions, 300);
      }
    }

    function undoDirectSave() {
      if (!state.toastUndoEventId) return;
      const targetId = state.toastUndoEventId;
      state.transactions = state.transactions.filter(t => t.event_id !== targetId);
      saveTransactions();
      state.showToast = false;
      state.toastUndoEventId = null;
      state.toastMessage = "";
      triggerHaptic(20);
      render();
    }

    function updatePresetProp(id, prop, value) {
      state.presets = state.presets.map(p => p.id === id ? { ...p, [prop]: value } : p);
      savePresetsLocally();
      render();
    }

    function deletePreset(id) {
      state.presets = state.presets.filter(p => p.id !== id);
      savePresetsLocally();
      render();
    }

    function restoreDefaultPresets() {
      state.presets = JSON.parse(JSON.stringify(DEFAULT_QUICK_PRESETS));
      savePresetsLocally();
      render();
    }

    function addNewPresetFromModal() {
      const emojiInput = document.getElementById("newPresetEmoji");
      const nameInput = document.getElementById("newPresetName");
      const amountInput = document.getElementById("newPresetAmount");
      const subcatInput = document.getElementById("newPresetSubcat");

      const name = (nameInput ? nameInput.value : "").trim();
      const amount = parseFloat(amountInput ? amountInput.value.replace(",", ".") : "0") || 0;
      const emoji = (emojiInput ? emojiInput.value.trim() : "") || "⚡";
      const subcatName = subcatInput ? subcatInput.value : (state.subcategories[0]?.name || "General");

      if (!name || amount <= 0) return;

      const newP = {
        id: `preset-${Date.now()}-${Math.random().toString(36).substring(2, 6)}`,
        name,
        emoji,
        amount: Math.round(amount * 100) / 100,
        subcategory_name: subcatName,
        concept: name
      };

      state.presets.push(newP);
      savePresetsLocally();
      render();
    }

    function getEmojiForName(name) {
      const lower = name.toLowerCase();
      if (lower.includes("nómina") || lower.includes("nomina") || lower.includes("salario") || lower.includes("sueldo")) return "💰";
      if (lower.includes("bizum")) return "📲";
      if (lower.includes("devoluc") || lower.includes("reembols")) return "🔄";
      if (lower.includes("venta") || lower.includes("vinted") || lower.includes("wallapop")) return "🏷️";
      if (lower.includes("ingreso") || lower.includes("interes") || lower.includes("dividend")) return "💵";
      if (lower.includes("café") || lower.includes("cafe") || lower.includes("desayun")) return "☕";
      if (lower.includes("super") || lower.includes("compra") || lower.includes("mercadona") || lower.includes("aliment")) return "🛒";
      if (lower.includes("restauran") || lower.includes("cen") || lower.includes("comid") || lower.includes("bar")) return "🍽️";
      if (lower.includes("gasol") || lower.includes("combust") || lower.includes("diesel")) return "⛽";
      if (lower.includes("farmac") || lower.includes("medic") || lower.includes("salud")) return "💊";
      if (lower.includes("pádel") || lower.includes("padel") || lower.includes("ocio") || lower.includes("deport")) return "🎾";
      if (lower.includes("alquiler") || lower.includes("hipoteca") || lower.includes("vivienda")) return "🏠";
      if (lower.includes("luz") || lower.includes("agua") || lower.includes("suministr")) return "💡";
      if (lower.includes("suscrip") || lower.includes("netflix") || lower.includes("spotify")) return "📱";
      if (lower.includes("emergenc") || lower.includes("colch")) return "🛡️";
      return "🏷️";
    }

    function getAuthHeaders() {
      const headers = { Accept: "application/json" };
      if (state.pairingToken) {
        headers["X-Mobile-Pairing-Token"] = state.pairingToken;
      }
      return headers;
    }

    // ==========================================
    // SINCRONIZACIÓN CON EL BACKEND
    // ==========================================
    async function checkServer() {
      if (typeof document !== "undefined" && document.visibilityState !== "visible") {
        return;
      }
      try {
        const res = await fetch("/api/mobile/status", { headers: getAuthHeaders() });
        if (res.ok) {
          const data = await res.json();
          state.isOnline = true;
          if (data.pairing_token) {
            state.isPaired = (state.pairingToken === data.pairing_token);
          }
          // Descargar catálogo solo si aún no se tiene en memoria
          if (!state.subcategories || state.subcategories.length === 0) {
            fetchCatalog();
          }
          // Si hay pendientes y está emparejado, sincronizar automáticamente
          const pending = state.transactions.filter(t => t.status === "PENDING_SYNC");
          if (pending.length > 0 && !state.isSyncing && state.isPaired) {
            syncTransactions();
          }
          if ((state.activeTab === "summary" || state.activeTab === "month") && !state.monthlySummary) {
            fetchMonthlySummary();
          }
          checkOtaVersion();
        } else if (res.status === 403) {
          state.isOnline = true;
          state.isPaired = false;
        } else {
          state.isOnline = false;
        }
      } catch {
        state.isOnline = false;
      }
      render();
    }

    async function fetchCatalog() {
      try {
        const res = await fetch("/api/mobile/catalog", { headers: getAuthHeaders() });
        if (res.ok) {
          const data = await res.json();
          if (data.personal_subcategories) {
            state.subcategories = data.personal_subcategories.map(s => ({
              ...s,
              emoji: getEmojiForName(s.name)
            }));
            saveCatalogLocally(data);
            render();
          }
        } else if (res.status === 403) {
          state.isPaired = false;
        }
      } catch (e) {
        console.log("Catálogo offline en caché");
      }
    }

    async function syncTransactions() {
      const pending = state.transactions.filter(t => t.status === "PENDING_SYNC");
      if (pending.length === 0 || state.isSyncing) return;

      state.isSyncing = true;
      render();

      try {
        const payload = {
          device_id: "mobile-pwa",
          transactions: pending.map(t => ({
            event_id: t.event_id,
            scope: "PERSONAL",
            type: t.type || "EXPENSE",
            amount: t.amount,
            description: t.description,
            date: t.date,
            subcategory_id: t.subcategory_id,
            subcategory_name: t.subcategory_name,
            created_at_utc: t.created_at_utc,
            receipt_base64: t.receipt_base64,
            receipt_filename: t.receipt_filename
          }))
        };

        const res = await fetch("/api/mobile/sync", {
          method: "POST",
          headers: {
            ...getAuthHeaders(),
            "Content-Type": "application/json"
          },
          body: JSON.stringify(payload)
        });

        if (res.ok) {
          state.transactions = state.transactions.map(t =>
            t.status === "PENDING_SYNC" ? { ...t, status: "SYNCED" } : t
          );
          saveTransactions();
          state.isOnline = true;
          state.isPaired = true;
          fetchMonthlySummary();
          fetchHistoryCache();
        } else if (res.status === 403) {
          state.isPaired = false;
          state.showTokenModal = true;
        }
      } catch (err) {
        console.error("Error sincronizando:", err);
        state.isOnline = false;
      } finally {
        state.isSyncing = false;
        render();
      }
    }

    async function createSubcategoryOnTheFly() {
      const name = state.newSubcatName.trim();
      const catName = state.newSubcatCategory;
      if (!name) return;

      let newSub = null;
      if (state.isOnline && state.isPaired) {
        try {
          const res = await fetch("/api/mobile/subcategory", {
            method: "POST",
            headers: {
              ...getAuthHeaders(),
              "Content-Type": "application/json"
            },
            body: JSON.stringify({ name, category_name: catName })
          });
          if (res.ok) {
            const data = await res.json();
            newSub = { ...data, emoji: getEmojiForName(data.name) };
          }
        } catch (e) {
          console.error("Error creando subcategoría online:", e);
        }
      }

      if (!newSub) {
        newSub = {
          id: -Date.now(),
          name,
          category_id: catName.includes("50%") ? 2 : 3,
          category_name: catName,
          is_frequent: true,
          emoji: getEmojiForName(name)
        };
      }

      state.subcategories.unshift(newSub);
      state.selectedSubcat = newSub;
      state.isCreatingSubcat = false;
      state.modalOpen = false;
      state.newSubcatName = "";
      state.searchQuery = "";
      render();
    }

    async function fetchMonthlySummary() {
      state.loadingSummary = true;
      render();
      try {
        const res = await fetch(`/api/mobile/summary?month=${state.summaryMonth}`, {
          headers: getAuthHeaders()
        });
        if (res.ok) {
          state.monthlySummary = await res.json();
        }
      } catch (e) {
        console.error(e);
      } finally {
        state.loadingSummary = false;
        render();
      }
    }

    async function updateSubcatBudget(subcatId) {
      const amount = parseFloat(state.editBudgetAmount.replace(",", ".")) || 0;
      try {
        const res = await fetch("/api/mobile/budget", {
          method: "POST",
          headers: {
            ...getAuthHeaders(),
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            subcategory_id: subcatId,
            allocated_amount: amount,
            month: state.summaryMonth
          })
        });
        if (res.ok) {
          state.editingBudgetSubcatId = null;
          state.editBudgetAmount = "";
          fetchMonthlySummary();
        }
      } catch (e) {
        alert("Error actualizando presupuesto");
      }
    }

    async function checkOtaVersion() {
      try {
        const res = await fetch("/api/mobile/version", { headers: getAuthHeaders() });
        if (res.ok) {
          const v = await res.json();
          if (v.version_code > state.currentVersionCode && v.apk_available) {
            state.availableUpdate = v;
            render();
          } else {
            state.availableUpdate = null;
          }
        }
      } catch (e) { }
    }

    async function fetchHistoryCache() {
      try {
        const res = await fetch("/api/mobile/transactions/history-cache?months=12", { headers: getAuthHeaders() });
        if (res.ok) {
          const data = await res.json();
          if (Array.isArray(data) && data.length > 0) {
            state.historyCache = data;
            localStorage.setItem(STORAGE_KEYS.HISTORY_CACHE, JSON.stringify(data));
          }
        }
      } catch (e) { }
    }

    async function searchServerHistory(query) {
      if (!query || !query.trim() || !state.isOnline || !state.isPaired) return;
      state.isSearchingServer = true;
      render();
      try {
        const res = await fetch(`/api/mobile/transactions/search?q=${encodeURIComponent(query.trim())}&limit=50`, {
          headers: getAuthHeaders()
        });
        if (res.ok) {
          const data = await res.json();
          state.searchServerResults = data.items || [];
        }
      } catch (e) {
        console.error("Error buscando en servidor:", e);
      } finally {
        state.isSearchingServer = false;
        render();
      }
    }

    function exportJson() {
      const pending = state.transactions.filter(t => t.status === "PENDING_SYNC");
      const payload = {
        device_id: "mobile-pwa",
        exported_at_utc: new Date().toISOString(),
        transactions: pending
      };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `evt_mob_${Date.now()}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    // ==========================================
    // ACCIONES DEL USUARIO
    // ==========================================
    function handleKey(k) {
      triggerHaptic(12);
      if (k === ",") {
        if (!state.amountStr.includes(",")) {
          state.amountStr = (state.amountStr === "0" ? "0," : state.amountStr + ",");
        }
      } else if (k === "DEL") {
        if (state.amountStr.length <= 1) {
          state.amountStr = "0";
        } else {
          state.amountStr = state.amountStr.slice(0, -1);
        }
      } else {
        if (state.amountStr === "0") {
          state.amountStr = k;
        } else {
          if (state.amountStr.includes(",")) {
            const parts = state.amountStr.split(",");
            if (parts[1] && parts[1].length >= 2) return;
          }
          if (state.amountStr.length < 8) {
            state.amountStr += k;
          }
        }
      }
      render();
    }

    function handleQuickAdd(val) {
      triggerHaptic(15);
      const current = parseFloat(state.amountStr.replace(",", ".")) || 0;
      const next = (current + val).toFixed(2).replace(".", ",");
      state.amountStr = next.endsWith(",00") ? next.replace(",00", "") : next;
      render();
    }

    function handleTypeSwitch(t) {
      state.txType = t;
      triggerHaptic(15);
      const isIncome = t === "INCOME";
      const filtered = state.subcategories.filter(s =>
        isIncome
          ? (s.category_type === "income" || (s.category_name && s.category_name.toLowerCase().includes("ingreso")))
          : (s.category_type !== "income" && (!s.category_name || !s.category_name.toLowerCase().includes("ingreso")))
      );
      state.selectedSubcat = filtered.find(s => s.is_frequent) || filtered[0] || state.subcategories[0] || null;
      render();
    }

    function saveExpense() {
      const num = parseFloat(state.amountStr.replace(",", ".")) || 0;
      if (num <= 0 || !state.selectedSubcat) return;

      triggerHaptic(40);

      const newTx = {
        event_id: `mob-${Date.now()}-${Math.random().toString(36).substring(2, 9)}`,
        scope: "PERSONAL",
        type: state.txType,
        amount: Math.round(num * 100) / 100,
        description: state.concept.trim() || state.selectedSubcat.name,
        date: state.selectedDate,
        subcategory_id: state.selectedSubcat.id,
        subcategory_name: state.selectedSubcat.name,
        created_at_utc: new Date().toISOString(),
        status: "PENDING_SYNC",
        receipt_base64: state.receiptBase64 || undefined
      };

      state.transactions.unshift(newTx);
      saveTransactions();

      state.amountStr = "0";
      state.concept = "";
      state.receiptBase64 = null;
      state.showToast = true;
      render();

      setTimeout(() => {
        state.showToast = false;
        render();
      }, 2000);

      if (state.isOnline && state.isPaired) {
        setTimeout(syncTransactions, 200);
      }
    }

    function handlePhotoCapture(e) {
      const file = e.target.files && e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        const img = new Image();
        img.onload = () => {
          const maxDim = 1280;
          let width = img.width;
          let height = img.height;
          if (width > height && width > maxDim) {
            height = Math.round((height * maxDim) / width);
            width = maxDim;
          } else if (height > maxDim) {
            width = Math.round((width * maxDim) / height);
            height = maxDim;
          }

          const canvas = document.createElement("canvas");
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext("2d");
          if (ctx) {
            ctx.drawImage(img, 0, 0, width, height);
            state.receiptBase64 = canvas.toDataURL("image/jpeg", 0.7);
            render();
          }
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
      e.target.value = "";
    }

    function getReceiptUrl(urlOrFilename) {
      if (!urlOrFilename) return "";
      if (urlOrFilename.startsWith("data:")) return urlOrFilename;
      let base = urlOrFilename.startsWith("/api/") ? urlOrFilename : `/api/mobile/receipts/${urlOrFilename}`;
      if (state.pairingToken) {
        base += (base.includes("?") ? "&" : "?") + "token=" + encodeURIComponent(state.pairingToken);
      }
      return base;
    }

    async function deleteTransaction(eventId) {
      const tx = state.transactions.find(t => t.event_id === eventId);
      if (!tx) return;
      if (!confirm(`¿Eliminar este gasto de ${tx.amount.toFixed(2)} € (${tx.description})?`)) return;

      triggerHaptic(20);
      state.transactions = state.transactions.filter(t => t.event_id !== eventId);
      saveTransactions();
      render();

      if (tx.status === "SYNCED") {
        try {
          const res = await fetch("/api/mobile/transactions/" + encodeURIComponent(eventId), {
            method: "DELETE",
            headers: getHeaders(),
          });
          if (!res.ok) {
            console.warn("No se pudo eliminar en el servidor inmediatamente, encolado para retry");
          }
        } catch (e) {
          console.warn("Error enviando delete al servidor:", e);
        }
      }
    }

    function saveTokenAndReconnect(tokenVal) {
      if (!tokenVal || !tokenVal.trim()) return;
      state.pairingToken = tokenVal.trim();
      localStorage.setItem(STORAGE_KEYS.PAIRING_TOKEN, state.pairingToken);
      state.showTokenModal = false;
      checkServer();
    }

    function formatEuro(n) {
      return (n || 0).toLocaleString("es-ES", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " €";
    }

                <button onclick="document.getElementById('ticketInput').click();" class="btn-press" style="width:100%; background:#0f172a; border:1px dashed #334155; border-radius:12px; padding:7px; color:#94a3b8; font-size:11px; font-weight:700; display:flex; align-items:center; justify-content:center; gap:6px; cursor:pointer;">

    function renderSearchView() {
      const q = (state.searchQueryHist || "").trim().toLowerCase();
      let displayResults = [];

      if (state.searchServerResults !== null) {
        displayResults = state.searchServerResults;
      } else if (q) {
        const combined = [
          ...state.transactions.map((t, idx) => ({
            id: -(idx + 1),
            date: t.date,
            amount: t.amount,
            description: t.description,
            subcategory_id: t.subcategory_id,
            subcategory_name: t.subcategory_name,
            category_name: "Cuenta Personal"
          })),
          ...state.historyCache
        ];
        displayResults = combined.filter(item => {
          const matchDesc = item.description && item.description.toLowerCase().includes(q);
          const matchSub = item.subcategory_name && item.subcategory_name.toLowerCase().includes(q);
          return matchDesc || matchSub;
        }).sort((a, b) => (b.date || "").localeCompare(a.date || ""));
      }

      const formatDate = (iso) => {
        if (!iso) return "";
        const parts = iso.split("-");
        return parts.length === 3 ? `${parts[2]}/${parts[1]}/${parts[0]}` : iso;
      };

      return `
          <div style="flex:1; padding:12px; overflow-y:auto; display:flex; flex-direction:column; gap:12px;" class="no-scrollbar">
            <!-- Barra de Búsqueda -->
            <div style="position:relative; display:flex; align-items:center;">
              <span style="position:absolute; left:12px; color:#64748b; font-size:14px; pointer-events:none;">🔍</span>
              <input type="text"
                placeholder="¿Cuánto me costó... (ej. itv, zara, taller)?"
                value="${state.searchQueryHist}"
                oninput="state.searchQueryHist = this.value; state.searchServerResults = null; render();"
                onkeydown="if(event.key === 'Enter') searchServerHistory(this.value);"
                autofocus
                style="width:100%; background:#0f172a; border:1px solid #1e293b; border-radius:14px; padding:10px 36px; color:#f8fafc; font-size:12px; font-weight:600; outline:none;" />
              ${state.searchQueryHist ? `
                <button onclick="state.searchQueryHist = ''; state.searchServerResults = null; render();" style="position:absolute; right:10px; background:none; border:none; color:#94a3b8; font-size:14px; cursor:pointer; padding:4px;">✕</button>
              ` : ""}
            </div>

            <!-- Sugerencias Rápidas si no hay texto -->
            ${!state.searchQueryHist ? `
              <div style="display:flex; flex-direction:column; gap:8px;">
                <div style="font-size:10px; font-weight:800; color:#94a3b8; text-transform:uppercase; letter-spacing:0.5px;">Consultas Frecuentes</div>
                <div style="display:flex; flex-wrap:wrap; gap:6px;">
                  ${[...new Set([...state.frequentConcepts, "Gasolina", "Supermercado", "Restaurante", "Farmacia"])].slice(0, 8).map(tag => `
                    <button onclick="state.searchQueryHist = '${tag}'; render();" class="btn-press" style="background:#0f172a; border:1px solid #1e293b; color:#cbd5e1; font-size:11px; font-weight:600; padding:6px 10px; border-radius:10px; cursor:pointer;">
                      ${tag}
                    </button>
                  `).join("")}
                </div>

                <div style="margin-top:10px; padding:14px; border-radius:16px; background:rgba(15,23,42,0.6); border:1px solid #1e293b; text-align:center; font-size:11px; color:#64748b; line-height:1.5;">
                  <div style="font-weight:800; color:#f1f5f9; font-size:13px; margin-bottom:4px;">🔍 Memoria Instantánea en tu Bolsillo</div>
                  Escribe cualquier concepto o comercio para ver cuánto pagaste la última vez, sin importar si estás en la tienda sin internet o en casa.
                </div>
              </div>
            ` : `
              <!-- Resultados -->
              <div style="display:flex; flex-direction:column; gap:8px;">
                <div style="display:flex; justify-content:space-between; align-items:center; font-size:11px; color:#94a3b8;">
                  <span>${displayResults.length} resultado${displayResults.length === 1 ? "" : "s"} para "${state.searchQueryHist}"</span>
                  ${state.isOnline && state.isPaired && state.searchServerResults === null ? `
                    <button onclick="searchServerHistory(state.searchQueryHist);" class="btn-press" style="background:none; border:none; color:#34d399; font-weight:800; font-size:11px; cursor:pointer;">
                      ${state.isSearchingServer ? "Buscando en servidor..." : "Buscar en todo el histórico"}
                    </button>
                  ` : ""}
                </div>

                ${displayResults.length === 0 ? `
                  <div style="padding:20px; text-align:center; background:#0f172a; border-radius:16px; border:1px solid #1e293b; color:#64748b; font-size:12px;">
                    🔎 No se encontraron gastos para "${state.searchQueryHist}".
                  </div>
                ` : `
                  <div style="display:flex; flex-direction:column; gap:6px;">
                    ${displayResults.map((item, idx) => {
        const isLatest = idx === 0;
        const emoji = getEmojiForName(item.subcategory_name || "");
        return `
                        <div style="padding:10px 12px; border-radius:14px; background:#0f172a; border:1px solid ${isLatest ? 'rgba(16,185,129,0.4)' : '#1e293b'}; display:flex; align-items:center; justify-content:space-between; gap:8px;">
                          <div style="display:flex; align-items:center; gap:8px; min-width:0;">
                            <span style="font-size:18px;">${emoji}</span>
                            <div style="min-width:0;">
                              <div style="display:flex; align-items:center; gap:6px;">
                                <span style="font-weight:700; font-size:13px; color:#f8fafc; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${item.description}</span>
                                ${isLatest ? `<span style="font-size:9px; font-weight:900; background:rgba(16,185,129,0.15); color:#34d399; padding:1px 5px; border-radius:4px; text-transform:uppercase;">Último</span>` : ""}
                              </div>
                              <div style="font-size:10px; color:#94a3b8; margin-top:1px;">
                                ${item.subcategory_name} • 📅 ${formatDate(item.date)}
                              </div>
                            </div>
                          </div>
                          <div style="display:flex; align-items:center; gap:6px;">
                            ${(item.receipt_filename || item.receipt_url) ? `
                              <button onclick="state.viewingReceiptUrl = getReceiptUrl('${item.receipt_url || item.receipt_filename}'); render();" title="Ver Ticket" style="background:none; border:none; color:#38bdf8; cursor:pointer; font-size:13px; padding:2px;">📷</button>
                            ` : ""}
                            <div style="font-family:monospace; font-weight:800; font-size:14px; color:${item.type === 'INCOME' ? '#34d399' : '#f8fafc'}; white-space:nowrap;">
                              ${item.type === 'INCOME' ? '+' : '-'}${item.amount.toFixed(2)} €
                            </div>
                          </div>
                        </div>
                      `;
      }).join("")}
                  </div>
                `}
              </div>
            `}
          </div>
        `;
    }

                        <div>
                          <div style="font-size:12px; font-weight:700; color:#f8fafc;">${sub.subcategory_name}</div>
                          <div style="font-size:9px; color:#64748b;">Gastado: ${formatEuro(sub.spent)}</div>
                        </div>

                        ${isEd ? `
                          <div style="display:flex; align-items:center; gap:4px;">
                            <input type="number" value="${state.editBudgetAmount}" oninput="state.editBudgetAmount = this.value;" style="width:65px; background:#020617; border:1px solid #10b981; border-radius:6px; color:#f8fafc; font-size:11px; padding:3px 6px; text-align:right;" autofocus />
                            <button onclick="updateSubcatBudget(${sub.subcategory_id});" class="btn-press" style="background:#10b981; color:#020617; border:none; border-radius:6px; font-weight:900; font-size:11px; padding:4px 6px; cursor:pointer;">✓</button>
                            <button onclick="state.editingBudgetSubcatId = null; render();" class="btn-press" style="background:#334155; color:#f8fafc; border:none; border-radius:6px; font-size:11px; padding:4px 6px; cursor:pointer;">✕</button>
                          </div>
                        ` : `
                          <div style="display:flex; align-items:center; gap:6px;">
                            <span style="font-family:monospace; font-weight:800; font-size:12px; color:#cbd5e1;">${formatEuro(sub.budget)}</span>
                            <button onclick="state.editingBudgetSubcatId = ${sub.subcategory_id}; state.editBudgetAmount = '${sub.budget || 0}'; render();" style="background:none; border:none; color:#94a3b8; cursor:pointer; font-size:12px;">✏️</button>
                          </div>
                        `}
                      </div>
                    `;
      }).join("")}
                </div>
              </div>
            `}
          </div>
        `;
    }

    function renderCategoryModal() {
      const q = state.searchQuery.toLowerCase();
      const filtered = state.subcategories.filter(s =>
        !q || s.name.toLowerCase().includes(q) || s.category_name.toLowerCase().includes(q)
      );

      return `
          <div style="position:fixed; inset:0; z-index:999; background:rgba(0,0,0,0.85); backdrop-filter:blur(4px); display:flex; flex-direction:column; justify-content:flex-end;">
            <div style="background:#0f172a; border-top:1px solid #1e293b; border-radius:24px 24px 0 0; max-height:85vh; display:flex; flex-direction:column; width:100%; max-width:400px; margin:0 auto; padding:16px;">
              <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
                <span style="font-weight:800; font-size:15px; color:#f8fafc;">
                  ${state.isCreatingSubcat ? "➕ Nueva Subcategoría" : "Seleccionar Categoría"}
                </span>
                <button onclick="state.modalOpen = false; state.isCreatingSubcat = false; render();" style="background:none; border:none; color:#94a3b8; font-size:18px; cursor:pointer;">✕</button>
              </div>

              ${state.isCreatingSubcat ? `
                <div style="display:flex; flex-direction:column; gap:12px; padding:6px 0;">
                  <div>
                    <label style="font-size:11px; font-weight:700; color:#94a3b8; display:block; margin-bottom:4px;">Nombre</label>
                    <input type="text" placeholder="Ej. Pádel, Sushi, Gas..." value="${state.newSubcatName}" oninput="state.newSubcatName = this.value;" style="width:100%; background:#020617; border:1px solid #1e293b; border-radius:12px; padding:10px 12px; color:#f8fafc; font-size:13px; outline:none;" autofocus />
                  </div>

                  <div>
                    <label style="font-size:11px; font-weight:700; color:#94a3b8; display:block; margin-bottom:4px;">Tipo (Regla 50/30/20 o Ingreso)</label>
                    <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:6px;">
                      <button onclick="state.newSubcatCategory = 'Necesidades Básicas (50%)'; render();" class="btn-press" style="padding:10px 4px; border-radius:12px; font-size:10px; font-weight:700; border:1px solid ${state.newSubcatCategory.includes('50%') ? '#10b981' : '#1e293b'}; background:${state.newSubcatCategory.includes('50%') ? 'rgba(16,185,129,0.15)' : '#020617'}; color:${state.newSubcatCategory.includes('50%') ? '#34d399' : '#94a3b8'}; cursor:pointer;">
                        🛒 Necesidad
                      </button>
                      <button onclick="state.newSubcatCategory = 'Deseos (30%)'; render();" class="btn-press" style="padding:10px 4px; border-radius:12px; font-size:10px; font-weight:700; border:1px solid ${state.newSubcatCategory.includes('30%') ? '#f59e0b' : '#1e293b'}; background:${state.newSubcatCategory.includes('30%') ? 'rgba(245,158,11,0.15)' : '#020617'}; color:${state.newSubcatCategory.includes('30%') ? '#fbbf24' : '#94a3b8'}; cursor:pointer;">
                        ☕ Deseo
                      </button>
                      <button onclick="state.newSubcatCategory = 'Ingresos Netos'; render();" class="btn-press" style="padding:10px 4px; border-radius:12px; font-size:10px; font-weight:700; border:1px solid ${state.newSubcatCategory.includes('Ingreso') ? '#38bdf8' : '#1e293b'}; background:${state.newSubcatCategory.includes('Ingreso') ? 'rgba(56,189,248,0.15)' : '#020617'}; color:${state.newSubcatCategory.includes('Ingreso') ? '#38bdf8' : '#94a3b8'}; cursor:pointer;">
                        💰 Ingreso
                      </button>
                    </div>
                  </div>

                  <div style="display:flex; gap:8px; margin-top:8px;">
                    <button onclick="state.isCreatingSubcat = false; render();" class="btn-press" style="flex:1; padding:12px; border-radius:12px; background:#1e293b; color:#cbd5e1; border:none; font-weight:700; font-size:12px; cursor:pointer;">
                      Atrás
                    </button>
                    <button onclick="createSubcategoryOnTheFly();" class="btn-press" style="flex:1; padding:12px; border-radius:12px; background:#10b981; color:#020617; border:none; font-weight:900; font-size:12px; cursor:pointer;">
                      Crear y Usar
                    </button>
                  </div>
                </div>
              ` : `
                <div style="display:flex; gap:6px; margin-bottom:10px;">
                  <input type="text" placeholder="Buscar categoría..." value="${state.searchQuery}" oninput="state.searchQuery = this.value; render();" autofocus style="flex:1; background:#020617; border:1px solid #1e293b; border-radius:12px; padding:10px 12px; color:#f8fafc; font-size:13px; outline:none;" />
                  <button onclick="state.isCreatingSubcat = true; state.newSubcatName = state.searchQuery; render();" class="btn-press" style="background:rgba(16,185,129,0.15); border:1px solid rgba(16,185,129,0.3); color:#34d399; font-weight:800; font-size:14px; padding:0 14px; border-radius:12px; cursor:pointer;" title="Crear nueva">
                    ➕
                  </button>
                </div>

                <div style="overflow-y:auto; flex:1; display:flex; flex-direction:column; gap:4px;" class="no-scrollbar">
                  ${filtered.length === 0 ? `
                    <div style="text-align:center; padding:20px; color:#64748b; font-size:12px;">
                      No existe "${state.searchQuery}".<br />
                      <button onclick="state.isCreatingSubcat = true; state.newSubcatName = state.searchQuery; render();" class="btn-press" style="margin-top:10px; background:#10b981; color:#020617; border:none; border-radius:10px; font-weight:800; font-size:11px; padding:8px 14px; cursor:pointer;">
                        ➕ Crear "${state.searchQuery || 'Nueva'}"
                      </button>
                    </div>
                  ` : `
                    ${filtered.map(s => `
                      <div onclick="state.selectedSubcat = state.subcategories.find(x => x.id === ${s.id}); state.modalOpen = false; render();" class="btn-press" style="padding:10px 12px; border-radius:12px; display:flex; align-items:center; justify-content:space-between; background:${state.selectedSubcat && state.selectedSubcat.id === s.id ? 'rgba(16,185,129,0.15)' : 'transparent'}; cursor:pointer;">
                        <div style="display:flex; align-items:center; gap:8px;">
                          <span style="font-size:18px;">${s.emoji || "🏷️"}</span>
                          <div>
                            <div style="font-weight:700; font-size:13px; color:#f8fafc;">${s.name}</div>
                            <div style="font-size:10px; color:#64748b;">${s.category_name}</div>
                          </div>
                        </div>
                        ${state.selectedSubcat && state.selectedSubcat.id === s.id ? `<span style="color:#10b981; font-weight:900;">✓</span>` : ""}
                      </div>
                    `).join("")}
                    <button onclick="state.isCreatingSubcat = true; state.newSubcatName = ''; render();" class="btn-press" style="margin-top:8px; padding:10px; border-radius:12px; border:1px dashed #1e293b; background:none; color:#94a3b8; font-size:11px; font-weight:700; cursor:pointer;">
                      ➕ Añadir otra subcategoría
                    </button>
                  `}
                </div>
              `}
            </div>
          </div>
        `;
    }

    function renderTokenModal() {
      return `
          <div style="position:fixed; inset:0; z-index:9999; background:rgba(0,0,0,0.85); backdrop-filter:blur(4px); display:flex; flex-direction:column; justify-content:center; padding:16px;">
            <div style="background:#0f172a; border:1px solid #1e293b; border-radius:20px; max-width:360px; margin:0 auto; padding:18px; display:flex; flex-direction:column; gap:12px; box-shadow:0 20px 40px rgba(0,0,0,0.8);">
              <div style="display:flex; justify-content:space-between; align-items:center;">
                <span style="font-weight:900; font-size:14px; color:#f8fafc;">🔑 Vincular con tu PC</span>
                <button onclick="state.showTokenModal = false; render();" style="background:none; border:none; color:#94a3b8; font-size:16px; cursor:pointer;">✕</button>
              </div>

              <p style="font-size:11px; color:#94a3b8; line-height:1.4;">
                Para proteger tu base de datos contra dispositivos ajenos conectados a tu Wi-Fi, introduce el Token de Emparejamiento generado en la app de PC (en <strong>Ajustes &gt; Companion Móvil</strong>):
              </p>

              <div>
                <input id="tokenInput" type="text" placeholder="sec_..." value="${state.pairingToken}" style="width:100%; background:#020617; border:1px solid #1e293b; border-radius:10px; padding:8px 10px; color:#f8fafc; font-family:monospace; font-size:12px; outline:none;" />
              </div>

              <div style="display:flex; gap:8px; margin-top:4px;">
                <button onclick="state.showTokenModal = false; render();" class="btn-press" style="flex:1; padding:10px; border-radius:10px; background:#1e293b; color:#cbd5e1; border:none; font-weight:700; font-size:11px; cursor:pointer;">
                  Cancelar
                </button>
                <button onclick="saveTokenAndReconnect(document.getElementById('tokenInput').value);" class="btn-press" style="flex:1; padding:10px; border-radius:10px; background:#10b981; color:#020617; border:none; font-weight:900; font-size:11px; cursor:pointer;">
                  Guardar y Conectar
                </button>
              </div>
            </div>
          </div>
        `;
    }

    function renderQuickPresets() {
      if (state.txType !== "EXPENSE") return "";
      return `
        <div style="margin:4px 0; display:flex; flex-direction:column; gap:4px;">
          <div style="display:flex; align-items:center; gap:6px; overflow-x:auto; padding:2px 0;" class="no-scrollbar">
            <div style="display:flex; gap:6px; flex-shrink:0;">
              ${state.presets.map(p => `
                <button
                  type="button"
                  onmousedown="handlePresetMouseDown('${p.id}');"
                  onmouseup="handlePresetMouseUp('${p.id}');"
                  onmouseleave="handlePresetMouseCancel();"
                  ontouchstart="handlePresetMouseDown('${p.id}');"
                  ontouchend="handlePresetMouseUp('${p.id}');"
                  ontouchcancel="handlePresetMouseCancel();"
                  class="btn-press"
                  style="position:relative; display:inline-flex; align-items:center; gap:5px; padding:6px 10px; border-radius:12px; background:#0f172a; border:1px solid #1e293b; color:#f8fafc; font-size:11px; font-weight:700; cursor:pointer;"
                >
                  <span style="font-size:13px;">${p.emoji}</span>
                  <span>${p.name}</span>
                  <span style="color:#34d399; font-family:monospace; font-weight:800; margin-left:2px;">${p.amount.toFixed(2).replace(".", ",")} €</span>
                </button>
              `).join("")}
            </div>
            <button
              onclick="state.managePresetsModalOpen = true; render();"
              class="btn-press"
              style="padding:6px 8px; border-radius:12px; background:#0f172a; border:1px solid #1e293b; color:#94a3b8; font-size:11px; cursor:pointer; margin-left:auto; flex-shrink:0;"
              title="Gestionar atajos"
            >
              ⚙️
            </button>
          </div>
          <div style="font-size:9.5px; color:#64748b; font-weight:600; padding:0 2px;">
            💡 Toca para rellenar · Mantén pulsado para 1-Tap directo
          </div>
        </div>
      `;
    }

    function renderManagePresetsModal() {
      return `
        <div style="position:fixed; inset:0; z-index:99999; background:rgba(0,0,0,0.85); backdrop-filter:blur(4px); display:flex; flex-direction:column; justify-content:center; padding:16px;">
          <div style="background:#0f172a; border:1px solid #1e293b; border-radius:20px; max-width:360px; margin:0 auto; width:100%; max-height:85vh; display:flex; flex-direction:column; box-shadow:0 20px 40px rgba(0,0,0,0.8); overflow:hidden;">
            <div style="display:flex; justify-content:space-between; align-items:center; padding:12px 16px; border-bottom:1px solid #1e293b;">
              <span style="font-weight:900; font-size:14px; color:#34d399;">⚙️ Atajos 1-Tap (${state.presets.length})</span>
              <button onclick="state.managePresetsModalOpen = false; render();" style="background:none; border:none; color:#94a3b8; font-size:16px; cursor:pointer;">✕</button>
            </div>
            <div style="padding:12px; overflow-y:auto; flex:1; display:flex; flex-direction:column; gap:8px;" class="no-scrollbar">
              ${state.presets.map((p) => `
                <div style="background:rgba(2,6,23,0.6); border:1px solid #1e293b; border-radius:12px; padding:8px 10px; display:flex; flex-direction:column; gap:6px;">
                  <div style="display:flex; align-items:center; justify-content:space-between; gap:6px;">
                    <div style="display:flex; align-items:center; gap:6px;">
                      <span style="font-size:16px;">${p.emoji}</span>
                      <input type="text" value="${p.name}" onchange="updatePresetProp('${p.id}', 'name', this.value);" style="background:#0f172a; border:1px solid #334155; border-radius:6px; color:#f8fafc; font-size:11px; font-weight:700; padding:2px 6px; width:80px;" />
                    </div>
                    <div style="display:flex; align-items:center; gap:4px;">
                      <input type="number" step="0.01" value="${p.amount}" onchange="updatePresetProp('${p.id}', 'amount', parseFloat(this.value)||0);" style="background:#0f172a; border:1px solid #334155; border-radius:6px; color:#34d399; font-family:monospace; font-size:11px; font-weight:800; padding:2px 6px; width:65px; text-align:right;" />
                      <span style="font-size:11px; color:#64748b; font-weight:800;">€</span>
                      <button onclick="deletePreset('${p.id}');" style="background:none; border:none; color:#ef4444; font-size:12px; cursor:pointer; padding:2px 4px;">🗑️</button>
                    </div>
                  </div>
                  <div style="display:flex; justify-content:space-between; align-items:center; font-size:10px; color:#64748b; border-top:1px solid #0f172a; padding-top:4px;">
                    <span>📂 Subcategoría:</span>
                    <select onchange="updatePresetProp('${p.id}', 'subcategory_name', this.value);" style="background:#0f172a; border:1px solid #1e293b; color:#94a3b8; border-radius:6px; font-size:10px; padding:2px 4px; max-width:160px;">
                      ${state.subcategories.map(s => `
                        <option value="${s.name}" ${s.name === p.subcategory_name ? 'selected' : ''}>${s.name}</option>
                      `).join("")}
                    </select>
                  </div>
                </div>
              `).join("")}

              <!-- Añadir nuevo -->
              <div style="background:#020617; border:1px dashed #334155; border-radius:12px; padding:10px; display:flex; flex-direction:column; gap:6px; margin-top:4px;">
                <div style="font-size:11px; font-weight:800; color:#34d399;">+ Añadir nuevo atajo</div>
                <div style="display:flex; gap:6px;">
                  <input id="newPresetEmoji" type="text" placeholder="Emoji" value="⚡" maxlength="2" style="background:#0f172a; border:1px solid #334155; border-radius:6px; color:#fff; font-size:12px; text-align:center; width:36px; padding:4px;" />
                  <input id="newPresetName" type="text" placeholder="Nombre (ej. Pan)" style="background:#0f172a; border:1px solid #334155; border-radius:6px; color:#fff; font-size:11px; flex:1; padding:4px 8px;" />
                </div>
                <div style="display:flex; gap:6px;">
                  <input id="newPresetAmount" type="number" step="0.01" placeholder="Importe €" style="background:#0f172a; border:1px solid #334155; border-radius:6px; color:#34d399; font-family:monospace; font-weight:800; font-size:11px; width:80px; padding:4px 6px;" />
                  <select id="newPresetSubcat" style="background:#0f172a; border:1px solid #334155; border-radius:6px; color:#94a3b8; font-size:10px; flex:1; padding:4px;">
                    ${state.subcategories.map(s => `<option value="${s.name}">${s.name}</option>`).join("")}
                  </select>
                </div>
                <button onclick="addNewPresetFromModal();" class="btn-press" style="background:#10b981; color:#020617; font-weight:800; font-size:11px; border:none; border-radius:8px; padding:6px; cursor:pointer; margin-top:2px;">
                  Añadir Atajo
                </button>
              </div>
            </div>
            <div style="padding:10px 14px; border-top:1px solid #1e293b; display:flex; justify-content:space-between; align-items:center; background:rgba(2,6,23,0.4);">
              <button onclick="restoreDefaultPresets();" style="background:none; border:1px solid #334155; color:#94a3b8; font-size:10px; border-radius:8px; padding:4px 8px; cursor:pointer;">
                Restaurar
              </button>
              <button onclick="state.managePresetsModalOpen = false; render();" class="btn-press" style="background:#10b981; color:#020617; font-weight:800; font-size:11px; border:none; border-radius:8px; padding:6px 14px; cursor:pointer;">
                Listo
              </button>
            </div>
          </div>
        </div>
      `;
    }

    function renderReceiptModal() {
      return `
        <div style="position:fixed; inset:0; z-index:99999; background:rgba(0,0,0,0.92); backdrop-filter:blur(6px); display:flex; flex-direction:column; justify-content:center; align-items:center; padding:16px;">
          <div style="position:relative; max-width:400px; width:100%; max-height:85vh; display:flex; flex-direction:column; background:#0f172a; border:1px solid #1e293b; border-radius:18px; overflow:hidden; box-shadow:0 20px 40px rgba(0,0,0,0.8);">
            <div style="display:flex; justify-content:space-between; align-items:center; padding:12px 16px; border-bottom:1px solid #1e293b;">
              <span style="font-weight:800; font-size:13px; color:#f8fafc;">📷 Comprobante de Compra</span>
              <button onclick="state.viewingReceiptUrl = null; render();" style="background:none; border:none; color:#94a3b8; font-size:18px; cursor:pointer;">✕</button>
            </div>
            <div style="flex:1; overflow:auto; padding:12px; display:flex; justify-content:center; align-items:center;">
              <img src="${state.viewingReceiptUrl}" style="max-width:100%; max-height:65vh; object-fit:contain; border-radius:8px;" alt="Ticket" />
            </div>
            <div style="padding:10px 16px; border-top:1px solid #1e293b; text-align:center;">
              <button onclick="state.viewingReceiptUrl = null; render();" class="btn-press" style="width:100%; padding:10px; background:#1e293b; color:#cbd5e1; border:none; border-radius:10px; font-weight:700; font-size:12px; cursor:pointer;">
                Cerrar
              </button>
            </div>
          </div>
        </div>
      `;
    }

    // Inicialización y Registro de Service Worker para PWA Offline
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("/mobile/sw.js").catch((err) => {
          console.log("Service Worker registro opcional:", err);
        });
      });
    }

    window.addEventListener("online", () => {
      state.isOnline = true;
      render();
      checkServer();
    });

    window.addEventListener("offline", () => {
      state.isOnline = false;
      render();
    });

    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") {
        checkServer();
      }
    });

    loadLocalState();
    render();
    checkServer();
    setTimeout(() => {
      if (state.isOnline && state.isPaired) {
        fetchCatalog();
        fetchMonthlySummary();
        fetchHistoryCache();
      }
    }, 600);
    setInterval(checkServer, 60000);
  </script>
</body>

</html>
