                        const expenseSubs = state.subcategories.filter(s => !isIncomeSubcat(s));
                        const matchedSub = findMatchingSubcategory(p, expenseSubs);
                        const activeSubName = (p.subcategory_id && expenseSubs.some(s => s.id === p.subcategory_id))
                          ? (expenseSubs.find(s => s.id === p.subcategory_id)?.name)
                          : (p.subcategory_name && expenseSubs.some(s => s.name === p.subcategory_name)
                              ? p.subcategory_name
                              : (matchedSub ? matchedSub.name : (expenseSubs[0]?.name || "")));
                        return expenseSubs.map(s => `
                          <option value="${escapeHtml(s.name)}" ${s.name === activeSubName ? 'selected' : ''}>${escapeHtml(s.name)}</option>
                        `).join("");
                      })()}
                    </select>
                  </div>
                </div>
              `).join("")}

              <!-- Añadir nuevo -->
              <div style="background:#020617; border:1px dashed #334155; border-radius:12px; padding:10px; display:flex; flex-direction:column; gap:6px; margin-top:4px;">
                <div style="font-size:11px; font-weight:800; color:#34d399;">+ Añadir nuevo atajo</div>
                <div style="display:flex; gap:6px;">
                  <input id="newPresetEmoji" type="text" placeholder="Emoji" value="⚡" maxlength="2" style="background:#0f172a; border:1px solid #334155; border-radius:6px; color:#fff; font-size:12px; text-align:center; width:46px; flex-shrink:0; padding:4px;" />
                  <input id="newPresetName" type="text" placeholder="Nombre (ej. Pan)" style="background:#0f172a; border:1px solid #334155; border-radius:6px; color:#fff; font-size:11px; flex:1; min-width:0; padding:4px 8px;" />
                </div>
                <div style="display:flex; gap:6px;">
                  <input id="newPresetAmount" type="number" step="0.01" placeholder="Importe €" style="background:#0f172a; border:1px solid #334155; border-radius:6px; color:#34d399; font-family:monospace; font-weight:800; font-size:11px; width:92px; flex-shrink:0; padding:4px 6px;" />
                  <select id="newPresetSubcat" style="background:#0f172a; border:1px solid #334155; border-radius:6px; color:#94a3b8; font-size:10px; flex:1; min-width:0; padding:4px;">
                    ${state.subcategories.filter(s => !isIncomeSubcat(s)).map(s => `<option value="${escapeHtml(s.name)}">${escapeHtml(s.name)}</option>`).join("")}
                  </select>
                </div>
                <button onclick="addNewPresetFromModal();" class="btn-press" style="background:#10b981; color:#020617; font-weight:800; font-size:11px; border:none; border-radius:8px; padding:6px; cursor:pointer; margin-top:2px;">
                  Añadir Atajo
                </button>
              </div>
            </div>
            <div style="padding:10px 14px; border-top:1px solid #1e293b; display:flex; justify-content:space-between; align-items:center; background:rgba(2,6,23,0.4);">
              <button onclick="restoreDefaultPresets();" style="background:none; border:1px solid #334155; color:#94a3b8; font-size:10px; border-radius:8px; padding:4px 8px; cursor:pointer;">
                Restaurar
              </button>
              <button onclick="state.managePresetsModalOpen = false; render();" class="btn-press" style="background:#10b981; color:#020617; font-weight:800; font-size:11px; border:none; border-radius:8px; padding:6px 14px; cursor:pointer;">
                Listo
              </button>
            </div>
          </div>
        </div>
      `;
    }

    function renderReceiptModal() {
      return `
        <div style="position:fixed; inset:0; z-index:99999; background:rgba(0,0,0,0.92); -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px); display:flex; flex-direction:column; justify-content:center; align-items:center; padding:16px;">
          <div style="position:relative; max-width:400px; width:100%; max-height:85vh; display:flex; flex-direction:column; background:#0F172A; border:1px solid rgba(255,255,255,0.12); border-radius:18px; overflow:hidden; box-shadow:0 20px 40px rgba(0,0,0,0.85);">
            <div style="display:flex; justify-content:space-between; align-items:center; padding:12px 16px; border-bottom:1px solid rgba(255,255,255,0.08);">
              <span style="font-weight:800; font-size:13px; color:#f8fafc;">📷 Comprobante de Compra</span>
              <button onclick="state.viewingReceiptUrl = null; render();" style="background:none; border:none; color:#94a3b8; font-size:18px; cursor:pointer;">✕</button>
            </div>
            <div style="flex:1; overflow:auto; padding:12px; display:flex; justify-content:center; align-items:center; background:#070B12;">
              <img src="${state.viewingReceiptUrl}" style="max-width:100%; max-height:65vh; object-fit:contain; border-radius:8px;" alt="Ticket" />
            </div>
            <div style="padding:10px 16px; border-top:1px solid rgba(255,255,255,0.08); text-align:center;">
              <button onclick="state.viewingReceiptUrl = null; render();" class="btn-press" style="width:100%; padding:10px; background:#172033; color:#cbd5e1; border:1px solid rgba(255,255,255,0.08); border-radius:10px; font-weight:700; font-size:12px; cursor:pointer;">
                Cerrar
              </button>
            </div>
          </div>
        </div>
      `;
    }

    // Inicialización y Registro de Service Worker para PWA Offline
    if ("serviceWorker" in navigator) {
      const hadSwController = !!navigator.serviceWorker.controller;
      let swRefreshing = false;
      navigator.serviceWorker.addEventListener("controllerchange", () => {
        if (hadSwController && !swRefreshing && !isInputFocused()) {
          swRefreshing = true;
          window.location.reload();
        }
      });

      window.addEventListener("load", () => {
        navigator.serviceWorker.register("/mobile/sw.js", { updateViaCache: "none" })
          .then((reg) => {
            swRegRef = reg;
            reg.update().catch(() => {});
          })
          .catch((err) => {
            console.log("Service Worker registro opcional:", err);
          });
      });
    }

    document.addEventListener("focusout", () => {
      if (pendingBackgroundRender) {
        setTimeout(() => {
          if (!isInputFocused() && pendingBackgroundRender) {
            pendingBackgroundRender = false;
            render();
          }
        }, 120);
      }
    });

    window.addEventListener("online", () => {
      state.isOnline = true;
      renderFromBackground();
      if (swRegRef) swRegRef.update().catch(() => {});
      checkServer();
    });

    window.addEventListener("offline", () => {
      state.isOnline = false;
      renderFromBackground();
    });

    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") {
        if (swRegRef) swRegRef.update().catch(() => {});
        checkServer();
      }
    });

    function syncVisualViewportHeight() {
      if (typeof window !== "undefined" && window.visualViewport && typeof document !== "undefined" && document.documentElement) {
        document.documentElement.style.setProperty("--vvh", `${window.visualViewport.height}px`);
      }
    }
    if (typeof window !== "undefined" && window.visualViewport) {
      window.visualViewport.addEventListener("resize", syncVisualViewportHeight);
      window.visualViewport.addEventListener("scroll", syncVisualViewportHeight);
      syncVisualViewportHeight();
    }

    loadLocalState();
    render();
    checkServer();
    setTimeout(() => {
      if (state.isOnline && state.isPaired) {
        fetchCatalog();
        fetchMonthlySummary();
        fetchHistoryCache();
      }
    }, 600);
    setInterval(checkServer, 15000);
  </script>
</body>

</html>
