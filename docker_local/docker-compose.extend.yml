services:
  backend:
    command: ["/bin/bash", "/app/images/backend/start_services.sh"]
    environment:
      - PYTHONPATH=/app/src:/app
      - DEVICE_ID=${DEVICE_ID:-}
      - SQLITE_JOURNAL_MODE=${SQLITE_JOURNAL_MODE:-DELETE}
    volumes:
      - ../:/app
      - /app/.venv

  frontend:
    command: ["/bin/bash", "/app/images/frontend/start_services.sh"]
    environment:
      - PYTHONPATH=/app/src:/app
      - API_URL=http://backend_gestor:8000
      - HOST_IP=${HOST_IP:-}
      - MOBILE_PUBLIC_URL=${MOBILE_PUBLIC_URL:-}
    volumes:
      - ../:/app
      - /app/.venv
