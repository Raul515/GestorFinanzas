services:
  backend:
    build: 
      dockerfile: ./images/backend/Dockerfile
      context: ../
    container_name: backend_gestor
    ports:
      - "8000:8000"
    networks: 
      - app-network
    volumes:
      - ../src/backend:/app/src/backend
      - ../src/backend/data:/app/src/backend/data
      - ../src/frontend:/app/src/frontend
      - ../src/mobile:/app/src/mobile
      - ../requirements:/app/requirements
      - ../sync:/app/sync
      - ../backups:/app/backups
    environment:
      - PYTHONPATH=/app/src:/app
      - DEVICE_ID=${DEVICE_ID:-}

  frontend:
    build: 
      dockerfile: ./images/frontend/Dockerfile
      context: ../
    container_name: frontend_gestor
    ports:
      - "8501:8501"
    depends_on: 
      - backend
    networks: 
      - app-network
    volumes:
      - ../src/frontend:/app/src/frontend
      - ../src/backend:/app/src/backend
    environment:
      - PYTHONPATH=/app/src:/app
      - API_URL=http://backend_gestor:8000
      - HOST_IP=${HOST_IP:-}

networks: 
  app-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.199.0/24
